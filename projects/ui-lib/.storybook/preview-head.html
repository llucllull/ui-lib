<!-- Fuente principal -->
<link rel="icon" type="image/svg+xml" href="/assets/storybook/mark-dark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
  rel="stylesheet"
/>

<!-- Estilos base -->
<link rel="stylesheet" href="main.css" />

<script>
  document.title = 'Ui-Lib Components';

  // Los temas de la lib viven bajo :root[data-theme=...] (main.css).
  // Sin esto, ninguna variable (--content-bg, --text-primary, ...) resuelve en el preview.
  document.documentElement.setAttribute(
    'data-theme',
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  );
</script>
