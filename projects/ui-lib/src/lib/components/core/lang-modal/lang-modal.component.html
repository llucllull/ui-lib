<div class="modal-content">
  <button (click)="closeModal()" class="close-btn">✕</button>
  @if (langs && langs.length > 0) {
    <ol>
      @for (lang of langs; track $index) {
        <li (click)="selectLang(lang)">
          <span class="item">{{ lang.label }}</span>
        </li>
      }
    </ol>
  }
</div>
