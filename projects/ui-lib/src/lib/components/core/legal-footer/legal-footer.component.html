<div class="legal-footer" [ngClass]="variant">
  <!-- Variante simple -->
  @if (variant === 'simple') {
    <div class="legal-footer__simple">
      <span>{{ brand }} © {{ year }}</span>
      <span>{{ credits }}</span>
    </div>
  }

  <!-- Variante extendida -->
  @if (variant === 'extended') {
    <div class="legal-footer__extended">
      <span>{{ brand }} © {{ year }}</span>
    
      <div class="legal-footer__right">
        @if(links?.length){
          <ul class="legal-footer__links">
            @for (link of links; track $index) {
              <li><a [href]="link.url">{{ link.label }}</a></li>
            }
          </ul>
        }
        <span>{{ credits }}</span>
      </div>
    </div>
  }
</div>
