<header>
  <div>
    <!-- Logo -->
    <span>★</span>
    <span>LLUC LLULL</span>
  </div>

  <div>
    <!-- Idioma -->
    <button (click)="openLanguagesModal()">
      <span>{{lang}}</span>
    </button>

    <!-- Icono de recarga -->
    <button (click)="toggleTheme()">
      <span>🌙</span>
    </button>

    <!-- Icono de menú -->
    <button (click)="toggleMenu()">
      <span>☰</span>
    </button>
  </div>
</header>

@if(isMenuOpen && navItems && navItems.length > 0) {
  <lib-nav-modal
    [navItems]="navItems"
    (close)="isMenuOpen = false"
  ></lib-nav-modal>
}
