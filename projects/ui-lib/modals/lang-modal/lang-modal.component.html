<button
  (click)="closeModal()"
  class="close-btn"
  [class.is-closing]="closing"
  type="button"
  aria-label="Close modal"
>
  ✕
</button>
<div class="modal-content" [class.is-closing]="closing">
  @if (langs && langs.length > 0) {
    <ol>
      @for (lang of langs; track lang.id) {
        <li (click)="selectLang(lang)">
          <span class="modal-item">{{ lang.label }}</span>
        </li>
      }
    </ol>
  }
</div>
