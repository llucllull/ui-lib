<div class="contact-minimal layout-padding">
  <div class="contact-minimal__content">
    <div class="contact-minimal__content-left">
      @if (contactsTitle) {
        <h2 class="subtitle" [highlight]="'#FFFFFF'">{{ contactsTitle }}</h2>
      }
      @for (contact of contacts; track $index) {
        <div class="btn-group">
          <a [href]="contact?.url" [linkType]="contact?.linkType" class="btn btn-link">
            {{ contact?.label }}
          </a>
        </div>
      }
    </div>
    <div class="contact-minimal__content-right">
      @if (socialsTitle) {
        <h2 class="subtitle" [highlight]="'#FFFFFF'">{{ socialsTitle }}</h2>
      }
      @for (social of socials; track $index) {
        <div class="btn-group">
          <a [href]="social?.url" [linkType]="social?.linkType" class="btn btn-link">
            {{ social?.label }}
          </a>
        </div>
      }
    </div>
  </div>
</div>
