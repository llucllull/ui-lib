<div class="columns-media-stacked main-grid col-span-full">
    <div class="columns-media-stacked__content main-grid col-span-full">
        @if(leftColumn) {
            <p 
                class="columns-media-stacked__content-column col-span-full md:col-span-4"
                [class.md:col-start-1]="direction === 'left'"
                [class.md:col-start-5]="direction === 'right'"
                [innerHTML]="leftColumn"
                scrollReveal
                from="left"
                distance="48px"
                duration="0.7s"
                [delay]="0"
                [threshold]="0"
                rootMargin="0px 0px -20% 0px"
            >   
            </p>
        }
        @if(rightColumn) {
            <p 
                class="columns-media-stacked__content-column col-span-full md:col-span-4"
                [class.md:col-start-5]="direction === 'left'"
                [class.md:col-start-9]="direction === 'right'"
                [innerHTML]="rightColumn"
                scrollReveal
                from="right"
                distance="48px"
                duration="0.7s"
                [delay]="120"
                [threshold]="0"
                rootMargin="0px 0px -20% 0px"
            >   
            </p>
        }
    </div>
    @if(image) {
        <div 
            class="columns-media-stacked__image col-span-full md:col-span-10"
            [class.md:col-start-1]="direction === 'left'"
            [class.md:col-start-3]="direction === 'right'"
            scrollReveal
            from="bottom"
            distance="64px"
            duration="0.8s"
            [delay]="180"
            [threshold]="0"
            rootMargin="0px 0px -20% 0px"
        >
             @if (image.publicId) {
                <ui-image [publicId]="image.publicId" [eager]="true" class="media-intro-img"></ui-image>
             } @else {
                <img [src]="image.url" [alt]="image.alt" class="media-intro-img" loading="eager" />
             }
        </div>
    }
</div>
