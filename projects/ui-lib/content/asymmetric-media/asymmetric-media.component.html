<div class="asymmetric-media main-grid col-span-full md:col-span-12 md:col-start-1">
    @if(media && media.length > 0) {
        <div class="asymmetric-media__items main-grid col-span-full md:col-span-12 md:col-start-1">
            @if(direction === 'left') {
                <div
                    class="asymmetric-media__items--small col-span-full md:col-span-4 md:col-start-1"
                    scrollReveal
                    from="bottom"
                    distance="64px"
                    duration="0.8s"
                    [threshold]="0"
                    rootMargin="0px 0px -25% 0px"
                >
                    @if (media[0]!.publicId) {
                        <ui-image [publicId]="media[0]!.publicId!" [eager]="true" class="asymmetric-media-img"></ui-image>
                    } @else {
                        <img [src]="media[0]!.url" [alt]="media[0]!.alt" class="asymmetric-media-img" loading="eager" />
                    }
                </div>
                <div
                    class="asymmetric-media__items--big col-span-full md:col-span-8 md:col-start-5"
                    scrollReveal
                    from="top"
                    distance="64px"
                    duration="0.8s"
                    [threshold]="0"
                    rootMargin="0px 0px -25% 0px"
                >
                    @if (media[1]!.publicId) {
                        <ui-image [publicId]="media[1]!.publicId!" [eager]="true" class="asymmetric-media-img"></ui-image>
                    } @else {
                        <img [src]="media[1]!.url" [alt]="media[1]!.alt" class="asymmetric-media-img" loading="eager" />
                    }
                </div>
            }
            @if(direction === 'right') {
                <div
                    class="asymmetric-media__items--small col-span-full md:col-span-8 md:col-start-1"
                    scrollReveal
                    from="bottom"
                    distance="64px"
                    duration="0.8s"
                    [threshold]="0"
                    rootMargin="0px 0px -25% 0px"
                >
                    @if (media[0]!.publicId) {
                        <ui-image [publicId]="media[0]!.publicId!" [eager]="true" class="asymmetric-media-img"></ui-image>
                    } @else {
                        <img [src]="media[0]!.url" [alt]="media[0]!.alt" class="asymmetric-media-img" loading="eager" />
                    }
                </div>
                <div
                    class="asymmetric-media__items--big col-span-full md:col-span-4 md:col-start-9"
                    scrollReveal
                    from="top"
                    distance="64px"
                    duration="0.8s"
                    [threshold]="0"
                    rootMargin="0px 0px -25% 0px"
                >
                    @if (media[1]!.publicId) {
                        <ui-image [publicId]="media[1]!.publicId!" [eager]="true" class="asymmetric-media-img"></ui-image>
                    } @else {
                        <img [src]="media[1]!.url" [alt]="media[1]!.alt" class="asymmetric-media-img" loading="eager" />
                    }
                </div>
            }
        </div>
    }
</div>
