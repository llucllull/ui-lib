<div class="section-intro col-span-8 col-start-3" scrollReveal>
  @if (pretitle) {
    <h2 class="pretitle">{{ pretitle }}</h2>
  }
  @if (title) {
    <h1 class="title">{{ title }}</h1>
  }
  @if (subtitle) {
    <h2 class="subtitle">{{ subtitle }}</h2>
  }
  @if (text) {
    <p class="text">{{ text }}</p>
  }
  @if (button) {
    <div class="btn-group">
      <a [href]="button.url" [linkType]="button.linkType" class="btn btn-link">
        <ui-icon [name]="button.icon!" [size]="17" [color]="'var(--color-primary)'"></ui-icon>
        {{ button.label }}
      </a>
    </div>
  }
</div>
