<div
  class="split-previewer col-span-full md:col-span-12 md:col-start-1"
  [class]="'split-previewer--' + direction"
>
  <div class="split-previewer__text-column">
    <div class="split-previewer__header" scrollReveal from="left" duration="1.2s">
      @if (title) {
        <h1 class="title">{{ title }}</h1>
      }
      @if (count) {
        <span class="count">{{ count }}</span>
      }
    </div>

    <div class="split-previewer__items" (mouseleave)="activeImage.set(undefined)">
      @for (item of items; track item.title) {
        <a
          [href]="item.link?.url"
          [linkType]="item.link?.linkType"
          (mouseenter)="activeImage.set(item.image)"
          class="split-previewer__item-link"
          scrollReveal
          from="left"
          duration="1.2s"
          [delay]="($index + 1) * 180"
        >
          <div class="split-previewer__item">
            <h2 class="split-previewer__item-title" [highlight]="highlightColor" [highlightThickness]="highlightThickness">{{ item.title }}</h2>
            <p class="split-previewer__item-text">{{ item.description }}</p>
            @if (item.tags?.length) {
              <div class="split-previewer__item-tags">
                <div class="split-previewer__item-tags-inner">
                  @for (tag of item.tags; track tag) {
                    <span class="split-previewer__item-tag">{{ tag }}</span>
                  }
                </div>
              </div>
            }
          </div>
        </a>
      }
    </div>
  </div>

  <div class="split-previewer__media">
    <div class="split-previewer__media-inner">
      @if ((activeImage() || imageDefault)?.publicId) {
        <ui-image 
          [publicId]="(activeImage() || imageDefault)!.publicId!" 
          [eager]="true"
          class="preview-img"
        ></ui-image>
      } @else {
        <img
          [src]="(activeImage() || imageDefault)?.url"
          [alt]="(activeImage() || imageDefault)?.alt"
          class="preview-img"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        />
      }
    </div>
  </div>
</div>
