<div class="social-footer">
  <div class="social-footer__slider-images swiper" appSwiper>
    <div class="swiper-wrapper">
      @for (image of images; track $index) {
        <div class="swiper-slide">
          <img [src]="image?.url" [alt]="image?.alt || ''" />
        </div>
      }
    </div>
    <div class="swiper-button-prev">
      <ui-icon name="arrow-left" [size]="18" color="#fff"></ui-icon>
    </div>
    <div class="swiper-button-next">
      <ui-icon name="arrow-right" [size]="18" color="#fff"></ui-icon>
    </div>
  </div>

  <div class="social-footer__bottom-section">
    @if (hashtag) {
      <div class="social-footer__hashtag">
        <span>{{ hashtag }}</span>
      </div>
    }
    @if (socials) {
      <div class="social-footer__socials">
        @for (social of socials; track $index) {
          <a [href]="social.url" [attr.aria-label]="social.label" [linkType]="social.linkType">
            @if (social.icon) {
              <ui-icon [name]="social.icon" [size]="28"></ui-icon>
            }
          </a>
        }
      </div>
    }
  </div>
</div>
