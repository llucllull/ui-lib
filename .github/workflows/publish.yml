name: publish.yml

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org
                  scope: '@lluc_llull'

            - name: Install dependencies
              run: npm ci --prefer-offline --no-audit

            - name: Run unit tests
              run: npm run test --if-present

            - name: Build styles
              run: npm run build-styles

            - name: Build library
              run: npx ng-packagr -p projects/ui-lib/ng-package.json

            - name: Copy CSS
              run: |
                  mkdir -p dist/ui-lib/styles
                  cp projects/ui-lib/src/lib/styles/main.css dist/ui-lib/styles/

            - name: Verify CSS exists
              run: |
                  if [ ! -f dist/ui-lib/styles/main.css ]; then
                    echo "❌ main.css missing"
                    exit 1
                  fi

            - name: Check version from package.json
              id: version
              run: |
                  VERSION=$(node -p "require('./dist/ui-lib/package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Validate tag matches version
              run: |
                  TAG=${GITHUB_REF#refs/tags/v}
                  if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
                    echo "❌ Tag ($TAG) does not match package.json version (${{ steps.version.outputs.version }})"
                    exit 1
                  fi

            - name: Publish to npm
              run: npm publish ./dist/ui-lib --access public --provenance
