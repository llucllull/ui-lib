name: publish.yml

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 1. Instalar PNPM antes de configurar Node
            - name: Setup PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            # 2. Configurar Node
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org

            # 3. Instalar dependencias con PNPM
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # 4. Tests y Compilación de la librería
            - name: Run unit tests
              run: pnpm test

            - name: Build styles
              run: pnpm run build-styles

            - name: Build library
              run: pnpm exec ng-packagr -p projects/ui-lib/ng-package.json

            - name: Copy CSS
              run: |
                  mkdir -p dist/ui-lib/styles
                  cp projects/ui-lib/src/lib/styles/main.css dist/ui-lib/styles/

            - name: Verify CSS exists
              run: |
                  if [ ! -f dist/ui-lib/styles/main.css ]; then
                    echo "❌ main.css missing"
                    exit 1
                  fi

            - name: Check version from package.json
              id: version
              run: |
                  VERSION=$(node -p "require('./dist/ui-lib/package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Validate tag matches version
              run: |
                  TAG=${GITHUB_REF#refs/tags/v}
                  if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
                    echo "❌ Tag ($TAG) does not match package.json version (${{ steps.version.outputs.version }})"
                    exit 1
                  fi

            # 5. Publicar usando el flujo nativo de PNPM para Trusted Publisher
            - name: Publish to npm
              run: |
                  cd dist/ui-lib
                  pnpm publish --no-git-checks --provenance --access public
              env:
                  NPM_CONFIG__AUTH: ${{ secrets.GITHUB_TOKEN }}