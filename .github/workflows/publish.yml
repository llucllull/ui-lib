name: Publish Package

on:
    push:
        tags:
            - 'ui-lib-v*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline --no-audit

            - name: Run unit tests
              run: npm run test

            - name: Build styles
              run: npm run build-styles

            - name: Build library
              run: npx ng-packagr -p projects/ui-lib/ng-package.json

            - name: Copy CSS
              run: |
                  mkdir -p dist/ui-lib/styles
                  cp projects/ui-lib/src/lib/styles/main.css dist/ui-lib/styles/

            - name: Verify CSS exists
              run: |
                  if [ ! -f dist/ui-lib/styles/main.css ]; then
                    echo "❌ main.css missing"
                    exit 1
                  fi

            - name: Publish package
              run: |
                  cd dist/ui-lib
                  npm publish --access public --provenance