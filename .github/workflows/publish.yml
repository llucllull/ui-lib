name: Publish Package

on:
    push:
        tags:
            - 'ui-lib-v*'

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/

            - name: Clean environment
              run: |
                  rm -rf node_modules dist
                  npm cache clean --force

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test -- --watch=false --browsers=ChromeHeadless --no-sandbox --disable-gpu

            - name: Build styles (main.css)
              run: npm run build-styles

            - name: Build package
              run: npm run build

            - name: Copy compiled CSS to dist
              run: |
                  mkdir -p dist/ui-lib/styles
                  cp projects/ui-lib/src/lib/styles/main.css dist/ui-lib/styles/

            - name: Check if main.css exists
              run: |
                  if [ ! -f dist/ui-lib/styles/main.css ]; then
                    echo "❌ main.css missing"
                    exit 1
                  fi

            - name: Authenticate to npm
              run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

            - name: Publish package
              run: |
                  cd dist/ui-lib
                  npm publish --access public
