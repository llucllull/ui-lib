name: publish.yml

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 1. Instalar PNPM antes de configurar Node
            - name: Setup PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            # 2. Configurar Node enlazado al registro de npm
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org

            # 3. Instalar dependencias con PNPM
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # 4. Compilar la librería Angular
            - name: Run unit tests
              run: pnpm test

            - name: Build styles
              run: pnpm run build-styles

            - name: Build library
              run: pnpm exec ng-packagr -p projects/ui-lib/ng-package.json

            - name: Copy CSS
              run: |
                  mkdir -p dist/ui-lib/styles
                  cp projects/ui-lib/src/lib/styles/main.css dist/ui-lib/styles/

            - name: Verify CSS exists
              run: |
                  if [ ! -f dist/ui-lib/styles/main.css ]; then
                    echo "❌ main.css missing"
                    exit 1
                  fi

            - name: Check version from package.json
              id: version
              run: |
                  VERSION=$(node -p "require('./dist/ui-lib/package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Validate tag matches version
              run: |
                  TAG=${GITHUB_REF#refs/tags/v}
                  if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
                    echo "❌ Tag ($TAG) does not match package.json version (${{ steps.version.outputs.version }})"
                    exit 1
                  fi
            
            # 5. Configurar autenticación para npm usando el token de GitHub Actions
            - name: Configure npm auth
              run: |
                echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

            # 6. Publicar usando el NPM_TOKEN
            - name: Publish to npm
              run: pnpm publish ./dist/ui-lib --no-git-checks --access public --registry https://registry.npmjs.org
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}