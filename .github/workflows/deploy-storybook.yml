name: Deploy Storybook

on:
    push:
        branches:
            - storybook

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # 1. Instalar PNPM antes de configurar Node
            - name: Setup PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 9 

            # 2. Configurar Node enlazando la caché de pnpm
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm' 

            # 3. Instalar dependencias usando pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # 4. Ejecutar el script con pnpm
            - name: Build Storybook
              run: pnpm run build-storybook

            # 5. Trigger Render Deploy
            - name: Trigger Render Deploy
              run: curl -X POST ${{ secrets.RENDER_STORYBOOK_DEPLOY_HOOK }}
